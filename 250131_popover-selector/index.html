<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ジャンル選択</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./gsap-eases.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="genre-selector">
      <h1 class="title">お好みのジャンルをお選びください</h1>
      <div class="genre-list">
        <label>
          <input
            type="checkbox"
            name="genre"
            value="drama"
          />
          <span class="genre-text">ドラマ</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="anime"
          />
          <span class="genre-text">アニメ</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="variety"
          />
          <span class="genre-text">バラエティ</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="sports"
          />
          <span class="genre-text">スポーツ</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="news"
          />
          <span class="genre-text">ニュース</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="documentary"
          />
          <span class="genre-text">ドキュメンタリー</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="music"
          />
          <span class="genre-text">音楽</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="movie"
          />
          <span class="genre-text">映画</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="education"
          />
          <span class="genre-text">教育・教養</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="kids"
          />
          <span class="genre-text">キッズ</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="cooking"
          />
          <span class="genre-text">料理</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
        <label>
          <input
            type="checkbox"
            name="genre"
            value="travel"
          />
          <span class="genre-text">旅行</span>
          <span class="checkmark material-icons">check_circle</span>
        </label>
      </div>
    </div>
  </body>
</html>
